# Sosial VPS infrastructure (Leaseweb, Singapore).
#
# The Supabase stack itself comes from the official self-hosted compose
# (cloned at execution, release pinned — see SERVER.md). THIS file holds
# only Sosial's own services. The worker joins the Supabase Docker network
# (`supabase_default`) and reaches the gateway as `api-gw:8000` — the
# Supabase compose publishes :8000/:5432/:6543 to 127.0.0.1 only, so nothing
# but Caddy (host) and the Docker networks can reach the stack.
# Realtime + Studio stay OFF in the Supabase compose (zero realtime usage
# verified in code; Studio managed via psql/CLI to save ~1 GB RAM).

name: sosial

services:
  web:
    # Next.js dashboard, self-hosted. Build args are the NEXT_PUBLIC_* values
    # (baked into the JS at build time), so changing any of them needs a
    # rebuild, not just a restart:
    #   docker compose -f docker-compose.services.yml build web
    #   docker compose -f docker-compose.services.yml up -d web
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://sosial.app}
        NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-https://docs.sosial.app}
        NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-}
    restart: always
    # A slow climb past this gets a clean restart, not a fight for host memory.
    mem_limit: 3g
    # Loopback only; Caddy (host) is the sole public entry point.
    ports:
      - 127.0.0.1:3002:3000
    environment:
      # Also present at runtime for server code that reads process.env lazily.
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://sosial.app}
      NEXT_PUBLIC_DOCS_URL: ${NEXT_PUBLIC_DOCS_URL:-https://docs.sosial.app}
      NEXT_PUBLIC_DASHBOARD_URL: ${NEXT_PUBLIC_DASHBOARD_URL:-}
      # Same service_role key as the worker — server-only (admin gates and
      # the Stripe webhook). Never sent to the browser.
      SUPABASE_SERVICE_ROLE_KEY: ${WORKER_SERVICE_ROLE_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Live price book (created 2026-10-17). Billing is server-side only:
      # the browser never sees these ids. pricesConfigured() requires the six
      # recurring ones; the lifetime price is optional (Ultimate plan).
      STRIPE_PRICE_SOLO_MONTHLY: ${STRIPE_PRICE_SOLO_MONTHLY:-}
      STRIPE_PRICE_SOLO_ANNUAL: ${STRIPE_PRICE_SOLO_ANNUAL:-}
      STRIPE_PRICE_TEAM_MONTHLY: ${STRIPE_PRICE_TEAM_MONTHLY:-}
      STRIPE_PRICE_TEAM_ANNUAL: ${STRIPE_PRICE_TEAM_ANNUAL:-}
      STRIPE_PRICE_BUSINESS_MONTHLY: ${STRIPE_PRICE_BUSINESS_MONTHLY:-}
      STRIPE_PRICE_BUSINESS_ANNUAL: ${STRIPE_PRICE_BUSINESS_ANNUAL:-}
      STRIPE_PRICE_ULTIMATE_LIFETIME: ${STRIPE_PRICE_ULTIMATE_LIFETIME:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
    volumes:
      # Keep the ISR/fetch cache across container restarts.
      - web-next-cache:/app/.next/cache
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  worker:
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
    restart: always
    environment:
      WORKER_SUPABASE_URL: http://api-gw:8000
      WORKER_SERVICE_ROLE_KEY: ${WORKER_SERVICE_ROLE_KEY}
      YT_CLIENT_ID: ${YT_CLIENT_ID}
      YT_CLIENT_SECRET: ${YT_CLIENT_SECRET}
      TT_CLIENT_KEY: ${TT_CLIENT_KEY}
      TT_CLIENT_SECRET: ${TT_CLIENT_SECRET}
      LI_CLIENT_ID: ${LI_CLIENT_ID}
      LI_CLIENT_SECRET: ${LI_CLIENT_SECRET}
      PIN_CLIENT_ID: ${PIN_CLIENT_ID}
      PIN_CLIENT_SECRET: ${PIN_CLIENT_SECRET}
      # true while the Pinterest app has Trial access (pins go to the API sandbox)
      PIN_SANDBOX: ${PIN_SANDBOX:-}
      PIN_SANDBOX_TOKEN: ${PIN_SANDBOX_TOKEN:-}
      TT_PHOTO_HOST: ${TT_PHOTO_HOST}
      WORKER_SITE_URL: https://sosial.app
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      MEDIA_ENV: prod
      STORAGE_BACKEND: r2
      # Fast claim poll + a few parallel slots: a queued post, reply or DM
      # starts within ~1s instead of waiting out an idle backoff.
      WORKER_POLL_MS: 1000
      WORKER_CONCURRENCY: 4
      WORKER_ERROR_MS: 15000
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  photo-host:
    build:
      context: ../apps/tiktok-photo-host
      dockerfile: Dockerfile
    restart: always
    ports:
      - 127.0.0.1:3000:3000
    environment:
      BASE_URL: ${TT_PHOTO_HOST_PUBLIC}
      UPLOAD_KEY: ${TT_PHOTO_HOST_KEY}
      DATA_DIR: /data
      TTL_HOURS: 24
      PORT: 3000
    volumes:
      - photo-host-data:/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: always
    ports:
      - 127.0.0.1:3001:3001
    volumes:
      - uptime-kuma:/app/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  # --- Monitoring (optional stack; all loopback-only, put behind Cloudflare Access) ---
  beszel:
    image: henrygd/beszel:latest
    restart: always
    environment:
      APP_URL: https://metrics.sosial.app
    ports:
      - 127.0.0.1:8090:8090
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Local agent over a shared unix socket (host network is required for host
  # NIC stats; it also lets the agent reach the hub on 127.0.0.1:8090).
  # BESZEL_KEY / BESZEL_TOKEN come from the hub's "Add System" dialog.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: always
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data
    environment:
      # No auth: Dozzle v11 exits with "No users.yaml or users.yml file found"
      # when the simple provider is set without that file. This port is
      # loopback-only (reach it over an SSH tunnel), so no auth is needed.
      # Before exposing it publicly, add a users.yml bind-mount and set
      # DOZZLE_AUTH_PROVIDER=simple (or put it behind Cloudflare Access).
      DOZZLE_ENABLE_ACTIONS: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  web-next-cache:
  photo-host-data:
  uptime-kuma:
  beszel-data:
  beszel-socket:
  beszel-agent-data:
  dozzle-data:

networks:
  # Join the Supabase stack's network so the worker resolves `api-gw` (and
  # `rest`/`db`) directly instead of needing a host-published port.
  default:
    name: supabase_default
    external: true
