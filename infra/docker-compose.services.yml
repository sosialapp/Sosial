# Sosial VPS infrastructure (Leaseweb, Singapore).
#
# The Supabase stack itself comes from the official self-hosted compose
# (cloned at execution, release pinned — see SERVER.md). THIS file holds
# only Sosial's own services. The worker joins the Supabase Docker network
# (`supabase_default`) and reaches the gateway as `api-gw:8000` — the
# Supabase compose publishes :8000/:5432/:6543 to 127.0.0.1 only, so nothing
# but Caddy (host) and the Docker networks can reach the stack.
# Realtime + Studio stay OFF in the Supabase compose (zero realtime usage
# verified in code; Studio managed via psql/CLI to save ~1 GB RAM).

name: sosial

services:
  worker:
    build:
      context: ../apps/worker
      dockerfile: Dockerfile
    restart: always
    environment:
      WORKER_SUPABASE_URL: http://api-gw:8000
      WORKER_SERVICE_ROLE_KEY: ${WORKER_SERVICE_ROLE_KEY}
      YT_CLIENT_ID: ${YT_CLIENT_ID}
      YT_CLIENT_SECRET: ${YT_CLIENT_SECRET}
      TT_CLIENT_KEY: ${TT_CLIENT_KEY}
      TT_CLIENT_SECRET: ${TT_CLIENT_SECRET}
      LI_CLIENT_ID: ${LI_CLIENT_ID}
      LI_CLIENT_SECRET: ${LI_CLIENT_SECRET}
      PIN_CLIENT_ID: ${PIN_CLIENT_ID}
      PIN_CLIENT_SECRET: ${PIN_CLIENT_SECRET}
      TT_PHOTO_HOST: ${TT_PHOTO_HOST}
      WORKER_SITE_URL: https://sosial.app
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      MEDIA_ENV: prod
      STORAGE_BACKEND: supabase
      WORKER_IDLE_MS: 30000
      WORKER_IDLE_MAX_MS: 60000
      WORKER_ERROR_MS: 15000
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"

  photo-host:
    build:
      context: ../apps/tiktok-photo-host
      dockerfile: Dockerfile
    restart: always
    ports:
      - 127.0.0.1:3000:3000
    environment:
      BASE_URL: ${TT_PHOTO_HOST_PUBLIC}
      UPLOAD_KEY: ${TT_PHOTO_HOST_KEY}
      DATA_DIR: /data
      TTL_HOURS: 24
      PORT: 3000
    volumes:
      - photo-host-data:/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  uptime-kuma:
    image: louislam/uptime-kuma:2
    restart: always
    ports:
      - 127.0.0.1:3001:3001
    volumes:
      - uptime-kuma:/app/data
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

  # --- Monitoring (optional stack; all loopback-only, put behind Cloudflare Access) ---
  beszel:
    image: henrygd/beszel:latest
    restart: always
    environment:
      APP_URL: https://metrics.sosial.app
    ports:
      - 127.0.0.1:8090:8090
    volumes:
      - beszel-data:/beszel_data
      - beszel-socket:/beszel_socket
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  # Local agent over a shared unix socket (host network is required for host
  # NIC stats; it also lets the agent reach the hub on 127.0.0.1:8090).
  # BESZEL_KEY / BESZEL_TOKEN come from the hub's "Add System" dialog.
  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: always
    network_mode: host
    volumes:
      - beszel-agent-data:/var/lib/beszel-agent
      - beszel-socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      TOKEN: ${BESZEL_TOKEN}
      KEY: ${BESZEL_KEY}
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  dozzle:
    image: amir20/dozzle:latest
    restart: always
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data
    environment:
      # No auth: Dozzle v11 exits with "No users.yaml or users.yml file found"
      # when the simple provider is set without that file. This port is
      # loopback-only (reach it over an SSH tunnel), so no auth is needed.
      # Before exposing it publicly, add a users.yml bind-mount and set
      # DOZZLE_AUTH_PROVIDER=simple (or put it behind Cloudflare Access).
      DOZZLE_ENABLE_ACTIONS: "true"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  photo-host-data:
  uptime-kuma:
  beszel-data:
  beszel-socket:
  beszel-agent-data:
  dozzle-data:

networks:
  # Join the Supabase stack's network so the worker resolves `api-gw` (and
  # `rest`/`db`) directly instead of needing a host-published port.
  default:
    name: supabase_default
    external: true
