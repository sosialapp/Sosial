name: deploy-vps

# Deploys the worker and the Supabase edge functions to the VPS after a merge to main.
# Needs three repo secrets: VPS_HOST, VPS_USER, VPS_SSH_KEY (a deploy-only key, see docs/DEPLOY.md).
# Run it by hand from the Actions tab with "Run workflow" to deploy only one part.

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'supabase/functions/**'
      - 'infra/docker-compose.services.yml'
      - '.github/workflows/deploy-vps.yml'
  workflow_dispatch:
    inputs:
      target:
        description: 'What to deploy'
        type: choice
        options: [both, worker, functions]
        default: both

concurrency:
  group: deploy-vps
  cancel-in-progress: false

env:
  APP_DIR: /opt/sosial
  FUNCTIONS_DIR: /opt/sosial/supabase/docker/volumes/functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Decide what changed
        id: what
        run: |
          t="${{ github.event.inputs.target }}"
          if [ -z "$t" ] || [ "$t" = both ]; then
            if [ "${{ github.event_name }}" = push ]; then
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed.txt || git ls-files > changed.txt
              w=false; f=false
              grep -qE '^(apps/worker/|infra/docker-compose.services.yml|\.github/workflows/deploy-vps.yml)' changed.txt && w=true
              grep -qE '^(supabase/functions/|\.github/workflows/deploy-vps.yml)' changed.txt && f=true
            else
              w=true; f=true
            fi
          elif [ "$t" = worker ]; then w=true; f=false
          else w=false; f=true; fi
          echo "worker=$w" >> "$GITHUB_OUTPUT"
          echo "functions=$f" >> "$GITHUB_OUTPUT"

      - name: Set up SSH
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -T 10 -H "$HOST" >> ~/.ssh/known_hosts
          cat > ~/.ssh/config <<CFG
          Host vps
            HostName $HOST
            User ${{ secrets.VPS_USER }}
            IdentityFile ~/.ssh/id_deploy
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          CFG

      - name: Deploy worker
        if: steps.what.outputs.worker == 'true'
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude dist --exclude .env \
            apps/worker/ vps:$APP_DIR/apps/worker/
          rsync -az infra/docker-compose.services.yml vps:$APP_DIR/infra/docker-compose.services.yml
          ssh vps "cd $APP_DIR/infra && docker compose -f docker-compose.services.yml build worker && docker compose -f docker-compose.services.yml up -d worker"
          sleep 8
          ssh vps "docker ps --filter name=sosial-worker --format '{{.Names}} {{.Status}}' && docker logs --tail 15 sosial-worker-1"

      - name: Deploy edge functions
        if: steps.what.outputs.functions == 'true'
        run: |
          # No --delete: the folder also holds functions managed on the server (main, etc.).
          rsync -az supabase/functions/ vps:$FUNCTIONS_DIR/
          ssh vps "cd $APP_DIR/supabase/docker && docker compose restart functions"
          sleep 5
          ssh vps "cd $APP_DIR/supabase/docker && docker compose ps functions"

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
