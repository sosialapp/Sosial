name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run scan
      # App test suites (vitest): web units + worker rules + mobile logic.
      # Edge functions are Deno and run on Supabase, not here.
      - run: npm test
        working-directory: apps/web
      # The worker has its own package.json and lockfile (not a workspace), so install it separately.
      - run: npm ci
        working-directory: apps/worker
      - run: npm test
        working-directory: apps/worker
      - run: npm test
